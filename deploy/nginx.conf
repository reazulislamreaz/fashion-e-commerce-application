# Nginx Configuration for Easy Fashion E-Commerce
# Domains:
#   Frontend: easy.elevateapparel.com.bd  (Proxy to http://127.0.0.1:3001)
#   Backend:  easyapi.elevateapparel.com.bd (Proxy to http://127.0.0.1:3000)
#
# Installation on VPS:
# Place this file in /etc/nginx/sites-available/easy-fashion
# Symlink: sudo ln -s /etc/nginx/sites-available/easy-fashion /etc/nginx/sites-enabled/
# Test & Reload: sudo nginx -t && sudo systemctl reload nginx
# SSL Certificate: sudo certbot --nginx -d easy.elevateapparel.com.bd -d easyapi.elevateapparel.com.bd

upstream frontend_server {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
}

upstream backend_server {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
}

# ==============================================================================
# 1. HTTP Redirect to HTTPS for Both Subdomains
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name easy.elevateapparel.com.bd easyapi.elevateapparel.com.bd;

    # Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. Frontend Subdomain (easy.elevateapparel.com.bd)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easy.elevateapparel.com.bd;

    # SSL Certificates (Managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/easy.elevateapparel.com.bd/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/easy.elevateapparel.com.bd/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js Static Assets Optimization
    location /_next/static/ {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Proxy all request traffic to Next.js (Port 9977)
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 3. Backend Subdomain (easyapi.elevateapparel.com.bd)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easyapi.elevateapparel.com.bd;

    # SSL Certificates (Managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/easy.elevateapparel.com.bd/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/easy.elevateapparel.com.bd/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Max upload size (for product image uploads)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript;

    # Proxy all API traffic to NestJS Backend (Port 9978)
    location / {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
